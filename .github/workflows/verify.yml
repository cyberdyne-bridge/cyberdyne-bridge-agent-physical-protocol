name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-cbap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q kernel agents tools
      - name: Silent-exception ratchet
        run: python tools/扫吞异常.py --baseline=tools/吞异常基线.json >/dev/null
      - name: CPNC conformance and security tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests/cbap -p 'test_*.py'
      - name: MCP definition, scope, and order tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests/mcp -p 'test_*.py'
      - name: Native task guards
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests/native -p 'test_*.py'
      - name: Body self-check and MC body SDK
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests/body -p 'test_*.py'

  python-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install static tools
        run: python -m pip install --quiet ruff bandit
      - name: Ruff fatal rules
        run: ruff check --select E9,F63,F7 --exclude runtime --exclude node_modules kernel agents tools drivers console
      - name: Bandit high-severity gate
        run: bandit -q -r kernel agents tools drivers console -x '*/runtime/*' -lll

  node-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agents/cyberdyne/hand/node/package-lock.json
      - name: Install hand dependencies
        working-directory: agents/cyberdyne/hand/node
        run: npm ci --ignore-scripts
      - name: Dependency audit
        working-directory: agents/cyberdyne/hand/node
        run: npm audit --omit=dev --audit-level=high
      - name: Syntax-check native hand
        run: |
          find agents/cyberdyne/hand/node -type f -name '*.js' \
            -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 node --check
      - name: JS behavior tests with coverage
        run: node --test --experimental-test-coverage tests/js/*.test.js

  audit-banner-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Require audit banner while audit report is open
        run: |
          grep -q '代码审计中' site/zh.html
          grep -q 'Code audit in progress' site/index.html
