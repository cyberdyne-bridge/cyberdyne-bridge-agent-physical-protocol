<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="MCP upstream status: SEP 3452 open, CBAP local mitigation (CPNC), execution authority not solved">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a0f"/>
      <stop offset="1" stop-color="#0d1a20"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1b2c33" stroke-width="1" opacity=".55"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect x="28" y="28" width="1144" height="304" rx="4" fill="#0a1117" stroke="#25414a"/>
  <text x="58" y="82" fill="#8aa0a8" font-family="DejaVu Sans Mono, monospace" font-size="16" letter-spacing="4">MCP / UPSTREAM STATUS</text>
  <text x="58" y="136" fill="#f3c969" font-family="DejaVu Sans Mono, monospace" font-size="34" font-weight="700">SEP #3452 · OPEN</text>
  <text x="58" y="174" fill="#d7e2e6" font-family="DejaVu Sans, sans-serif" font-size="18">Tool definition integrity is still being discussed upstream.</text>
  <text x="58" y="202" fill="#d7e2e6" font-family="DejaVu Sans, sans-serif" font-size="18">CBAP ships a local mitigation, not an official fix.</text>
  <line x1="58" y1="230" x2="1140" y2="230" stroke="#25414a"/>
  <text x="58" y="268" fill="#5eead4" font-family="DejaVu Sans Mono, monospace" font-size="17">1D/2D  DEFINITION PIN   GUARDED  v1.7.5</text>
  <text x="58" y="298" fill="#f3c969" font-family="DejaVu Sans Mono, monospace" font-size="17">3D     EXECUTION AUTH   NOT SOLVED</text>
  <text x="58" y="328" fill="#8aa0a8" font-family="DejaVu Sans Mono, monospace" font-size="14">WAITING FOR OFFICIAL SPEC / NO DUPLICATE ISSUES / LOCAL TESTS ONLY</text>
  <rect x="896" y="64" width="248" height="40" rx="3" fill="#2a2110" stroke="#7a5a1a"/>
  <text x="920" y="90" fill="#f3c969" font-family="DejaVu Sans Mono, monospace" font-size="14">WAITING · UPSTREAM</text>
</svg>
